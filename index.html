<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="alertContainer" class="container mt-3"></div>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Expense Tracker</span>
        </div>
    </nav>

    <div class="container py-5">


        <!-- Summary Cards -->
        <div class="summary-grid mb-4">

            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Total Amount</h6>
                    <h3 id="totalAmount">0.00</h3>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Number of Expenses</h6>
                    <h3 id="expenseCount">0</h3>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">Highest Expense</h6>
                    <h3 id="highestExpense">0.00</h3>
                </div>
            </div>

        </div>

        <div class="card shadow-sm mb-4">
 
            <div class="card-body">

                <div class="mb-4">
                    <h5 class="mb-3">Add Expense</h5>

                    <form id="expenseForm">

                        <div class="row g-3">

                            <div class="col-md-4">
                                <label for="title" class="form-label">Title</label>
                                <input type="text"
                                       id="title"
                                       class="form-control"
                                       required>
                            </div>

                            <div class="col-md-3">
                                <label for="amount" class="form-label">Amount</label>
                                <input type="number"
                                       id="amount"
                                       class="form-control"
                                       min="0.01"
                                       step="0.01"
                                       required>
                            </div>

                            <div class="col-md-3">
                                <label for="category" class="form-label">Category</label>
                                <select id="category" class="form-select" required>
                                    <option value="">Select Category</option>
                                    <option value="1">Food</option>
                                    <option value="2">Transport</option>
                                    <option value="3">Bills</option>
                                    <option value="4">Entertainment</option>
                                    <option value="5">Other</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label for="expenseDate" class="form-label">Date</label>
                                <input type="date"
                                       id="expenseDate"
                                       class="form-control"
                                       required>
                            </div>

                        </div>

                        <button type="submit" class="btn btn-primary mt-3">
                            Add Expense
                        </button>

                    </form>
                </div>

            </div>

        </div>

        <div class="card shadow-sm">

            <div class="card-body">

                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h5 class="mb-0">Expenses</h5>

                    <div class="d-flex align-items-center gap-2">
                        <label for="filterCategory" class="form-label mb-0">
                            Category
                        </label>

                        <select id="filterCategory"
                                class="form-select"
                                style="width: 180px;">
                            <option value="">All</option>
                            <option value="1">Food</option>
                            <option value="2">Transport</option>
                            <option value="3">Bills</option>
                            <option value="4">Entertainment</option>
                            <option value="5">Other</option>
                        </select>
                    </div>

                </div>

                <!-- Table -->
                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Title</th>
                                <th>Amount</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="expensesTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </div>
    <!-- Edit Expense Modal -->

    <div class="modal fade" id="editExpenseModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Edit Expense</h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body">

                    <form id="editExpenseForm">

                        <input type="hidden" id="editExpenseId">

                        <div class="mb-3">
                            <label for="editTitle" class="form-label">
                                Title
                            </label>

                            <input type="text"
                                   id="editTitle"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="editAmount" class="form-label">
                                Amount
                            </label>

                            <input type="number"
                                   id="editAmount"
                                   class="form-control"
                                   min="0.01"
                                   step="0.01"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="editCategory" class="form-label">
                                Category
                            </label>

                            <select id="editCategory" class="form-select" required>
                                <option value="">Select Category</option>
                                <option value="1">Food</option>
                                <option value="2">Transport</option>
                                <option value="3">Bills</option>
                                <option value="4">Entertainment</option>
                                <option value="5">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="editExpenseDate" class="form-label">
                                Date
                            </label>

                            <input type="date"
                                   id="editExpenseDate"
                                   class="form-control"
                                   required>
                        </div>

                        <button type="submit"
                                class="btn btn-primary">
                            Save Changes
                        </button>

                    </form>

                </div>

            </div>
        </div>
    </div>

    <div id="loadingSpinner" class="text-center my-4 d-none">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/app.js"></script>


</body>
</html>
